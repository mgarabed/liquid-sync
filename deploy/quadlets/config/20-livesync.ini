; The CouchDB settings Self-hosted LiveSync needs, exactly as its own
; provisioning script applies them through the config API:
; https://github.com/vrtmrz/obsidian-livesync/blob/70899e2fd44277e564173d2c45ee7fde6f499185/utils/couchdb/provision.ts
; They live here instead, so they're declared in the repo. scripts/check-couchdb-config
; compares the running node with this file and fails on any drift.
;
; cors/origins is LiveSync's default list: Obsidian desktop, mobile, and
; localhost. CouchDB refuses origins = * together with credentials = true.

[chttpd]
require_valid_user = true
enable_cors = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[couchdb]
max_document_size = 50000000

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost
