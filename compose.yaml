# liquid-sync stack. This file is the source of truth: the quadlets in
# deploy/quadlets/ are generated from it by podlet (scripts/check-quadlets
# --write). Follow the compose rules in
# docs/decisions/0001-container-runtime-and-deployment.md for every change.
name: liquid-sync

services:
  couchdb:
    image: docker.io/library/couchdb:3.5
    container_name: liquid-sync-couchdb
    networks: [liquid-sync]
    labels:
      io.containers.autoupdate: registry
    env_file: couchdb.env
    ports: ["127.0.0.1:5984:5984"]
    # config/ is mounted outside /opt/couchdb and its .ini files are copied
    # into local.d/ at start. The image's entrypoint chowns everything under
    # /opt/couchdb under `set -e`, so a read-only bind mount there makes it
    # exit 1 under rootless Podman. Copying also leaves local.d/docker.ini,
    # where the entrypoint writes the admin, writable and last in the chain.
    entrypoint:
      - /bin/sh
      - -c
      - cp /liquid-sync/config/*.ini /opt/couchdb/etc/local.d/ && exec /docker-entrypoint.sh /opt/couchdb/bin/couchdb
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./config:/liquid-sync/config:ro,Z
    mem_limit: 512m
    restart: unless-stopped

networks:
  liquid-sync:

volumes:
  couchdb-data:
